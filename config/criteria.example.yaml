# Role targeting rules for the search agent.
# Edit freely — every change is one commit, one diff.
# See job-search-agent-spec.md §3.2 for the schema and §3.5 for how these feed into scoring.

role_families:
  - developer-relations        # DevRel engineer, developer advocate, docs lead
  - forward-deployed-engineer  # FDE, solutions engineer, applied engineer
  - agentic-programmer         # AI engineer, agent/LLM infra, MCP / Claude Code-adjacent
  - technical-writer           # staff technical writer, DX writer, API docs lead

title_keywords_include:
  - "developer advocate"
  - "developer relations"
  - "devrel"
  - "forward deployed"
  - "solutions engineer"
  - "applied engineer"
  - "ai engineer"
  - "agent engineer"
  - "technical writer"
  - "documentation engineer"
  - "developer experience"
  - "prompt engineer"
  - "ai research engineer"

title_keywords_exclude:
  - "intern"
  - "internship"
  - "sales development"
  - "account executive"
  - "marketing manager"
  - "product manager"          # remove if pivoting to PM later
  - "engineering manager"      # IC focus for now
  - "director"
  - "vp,"
  - "vp of"
  - "chief"

seniority: [mid, senior, staff]

location:
  base: "San Francisco Bay Area"
  remote_ok: true
  relocate_for:
    - "New York, NY"
    - "Remote (US)"
    - "Seattle, WA"
  on_site_only: exclude

# Soft filter. Listings below this in *posted min* get scored −10 but are not dropped.
# Set to null to disable entirely for Phase 1.
comp_floor_usd: 180000

equity_required: false
stage_preference: [series-b, series-c, public]   # not a hard gate

# Companies to hard-exclude (regrettable interviews, conflicts, etc.)
company_exclude: []

# Terms that bump score when they appear in the JD (each +10, capped at +30).
tech_affinity_boost:
  - "MCP"
  - "Model Context Protocol"
  - "Claude"
  - "Anthropic"
  - "agent"
  - "LLM"
  - "Next.js"
  - "Playwright"
  - "Sanity"
  - "docs as code"
  - "developer experience"
  - "technical documentation"

# Recommendation thresholds (see run.py). Tune after the first run.
score_thresholds:
  yes: 70
  maybe: 40
