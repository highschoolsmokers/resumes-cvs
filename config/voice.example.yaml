# config/voice.yaml — knobs for cover-letter-writer and (from Phase 4)
# reply-drafter + scheduler. This file is consulted alongside
# voice-corpus/*.md before any outbound prose is drafted.
#
# Schema per job-search-agent-spec.md §5.2 (cover letter) and §6.8
# (scheduling). Not under source control for secrets, but voice.yaml is
# not sensitive — this file IS committed.

# ─── Cover letter constraints ──────────────────────────────────────────

length:
  # Target word count — three tight paragraphs. Hard fail if the draft
  # exceeds hard_max. The writer should stop extending and cut instead.
  target_min: 300
  target_max: 400
  hard_max: 500

opening: >-
  Specific hook. A product detail, recent announcement, customer name, or
  JD signal that only someone who actually read the listing would write.
  Never "I am writing to apply" / "I am writing to express my interest".
  Never restate the role title in the first sentence.

close: >-
  Direct. What W.S. would want to talk about in a first conversation, or
  the specific thing he'd bring to this role's first 90 days. No
  "thank you for your consideration", no "I look forward to hearing from
  you". If the letter needs a sign-off, the signature line carries it.

pronouns: first-person

# Phrases the cover-letter agent must never emit. This list is
# intentionally small and strong — each phrase is a tell that the draft
# is generic. Extend sparingly; every addition is a hard match.
forbidden_phrases:
  - "passionate about"
  - "dynamic team"
  - "wear many hats"
  - "wearing many hats"
  - "results-oriented"
  - "results-driven"
  - "team player"
  - "self-starter"
  - "go-getter"
  - "think outside the box"
  - "synergy"
  - "synergies"
  - "leverage my"
  - "leveraging my"
  - "thank you for your consideration"
  - "i look forward to hearing from you"
  - "i am writing to apply"
  - "i am writing to express"
  - "in today's fast-paced"
  - "fast-paced environment"
  - "bring to the table"
  - "at the intersection of"     # overused; unsharpens specific claims

# Structural fingerprint — stylistic guardrails the agent should honour
# without being prescriptive about content.
style_notes:
  - "Concrete nouns beat adjectives. Name the thing. Cite the URL."
  - "First person, active voice, past tense for completed work."
  - "Specific numbers when you have them, not vague comparatives."
  - "One sentence per idea. If a sentence has two 'and's, it's probably two sentences."
  - "No em-dashes as decorative flourishes. Use them sparingly for genuine parenthetical pivots."
  - "Don't open a paragraph with 'I'. Lead with the detail, then the person."
  - "Verbs: 'shipped', 'wrote', 'owned', 'built'. Avoid 'managed', 'oversaw', 'facilitated' unless literally accurate."

signature: "Your Name"

# ─── Scheduling preferences (Phase 4 — scheduler agent) ────────────────

# Used by agents/scheduler.md (spec §6.8) when proposing candidate slots
# for recruiter screens and interviews. The scheduler reads these values
# and only proposes non-conflicting slots inside the window.
scheduling_preferences:
  timezone: "America/Los_Angeles"
  window_business_days: 10           # look this far out for candidate slots
  day_start: "09:00"
  day_end: "18:00"

  # Days of the week to exclude entirely (0 = Monday … 6 = Sunday).
  # Empty list = propose any business day.
  excluded_weekdays: [5, 6]          # no Sat/Sun

  # Durations (in minutes) to reserve around each proposed slot, so the
  # scheduler doesn't stack back-to-back meetings.
  buffer_before_min: 15
  buffer_after_min: 15

  # Soft preferences — the scheduler ranks these higher when choosing
  # among conflict-free slots. Order matters.
  preferred_blocks:
    - "10:00-12:00"
    - "14:00-16:30"

  # Calendly detection — if the recruiter's email contains a Calendly
  # link, the scheduler will NOT auto-book. It surfaces the link to the
  # user and asks them to pick a slot manually.
  auto_book_calendly: false

  # Tentative event titling template. The scheduler creates a
  # Google Calendar event with this title when it proposes slots.
  tentative_title_template: "[TENTATIVE] {company} — {role} — {stage}"

  # Stages the scheduler recognises in recruiter threads. These feed the
  # {stage} field above. Anything not in this list falls through to
  # "Screen".
  known_stages:
    - "Screen"
    - "Recruiter Call"
    - "Hiring Manager"
    - "Technical Screen"
    - "Onsite"
    - "Panel"
    - "Debrief"
