# config/personal-facts.example.yaml — the canonical schema for the
# reply-drafter's closed universe of personal claims.
#
# This file is committed; `config/personal-facts.yaml` (the one the
# reply-drafter actually reads) is gitignored and filled by the user
# on their own machine. The agent never writes to either file.
#
# Rules (spec §8.7, CLAUDE.md §6):
#   - Any recruiter question whose answer isn't grounded in a key below
#     becomes a `[USER TO ANSWER: <question>]` placeholder in the draft.
#     The agent never guesses at eligibility, comp, dates, or location.
#   - The pre-commit hook blocks attempts to stage `personal-facts.yaml`.
#   - New schema fields are added HERE first (with placeholder values),
#     so check_provenance.py can resolve `personal-fact:<dotted.path>`.
#
# Dotted-path resolution (used by check_provenance.py — kind
# `personal-fact:`):
#
#     personal-fact:eligibility.us_work_auth
#     personal-fact:compensation.target_base_usd
#     personal-fact:availability.earliest_start_date
#
# Any top-level key or nested key is a valid dotted path. A cover-letter
# or reply draft that asserts a personal claim must cite the deepest
# key that resolves to a concrete value — not an intermediate container.
#
# ---------------------------------------------------------------------
# How to use this file
# ---------------------------------------------------------------------
#
#   1. Copy it: `cp config/personal-facts.example.yaml config/personal-facts.yaml`
#   2. Fill in the REAL values on your machine. Leave fields you aren't
#      ready to automate as `null` — the reply-drafter will render those
#      as `[USER TO ANSWER: …]` in every draft.
#   3. NEVER commit `config/personal-facts.yaml`. It's gitignored. If you
#      need to share its shape, edit THIS file (the .example), which is
#      the schema reference only.
#
# ---------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------

eligibility:
  # Accepted values: "us-citizen", "permanent-resident", "h1b", "o1",
  # "tn", "requires-sponsorship", "other". Any value you set here is
  # the literal the reply-drafter may cite in a recruiter response.
  us_work_auth: null

  # True if you'd need a company to sponsor a visa to start this job.
  # Reply-drafter cites this verbatim on "are you authorized…" questions.
  sponsorship_needed: null

  # e.g. "secret", "top-secret", null. Rarely relevant; leave null
  # unless you hold or are pursuing a clearance.
  clearance: null

compensation:
  # Target base SALARY range in USD, [min, max]. The reply-drafter will
  # cite the range verbatim on comp questions; it never quotes a single
  # number. If you don't want to disclose, leave null and handle the
  # question manually via [USER TO ANSWER].
  target_base_usd: null             # e.g. [200000, 260000]

  # Total comp including equity + bonus, [min, max] in USD. Used only if
  # the recruiter asks specifically about OTE / total; otherwise base
  # alone is quoted.
  target_total_comp_usd: null       # e.g. [260000, 360000]

  # Whether you require equity. True / false / null (no strong preference).
  equity_required: null

  # Free-text. If the recruiter asks about bonus, this string is cited
  # verbatim. Keep it short and literal — the draft will quote it.
  bonus_expectations: null          # e.g. "open; not a dealbreaker"

availability:
  # ISO-8601 date, earliest you could start. The reply-drafter cites
  # this verbatim on "when could you start" questions.
  earliest_start_date: null         # e.g. "2026-06-01"

  # Notice period you'd give a current employer, in calendar days. null
  # if not currently employed.
  notice_period_days: null          # e.g. 14 or null

  # Hours you're willing to take screens / calls, local to your timezone
  # (which lives in config/voice.yaml → scheduling_preferences.timezone).
  # The scheduler uses this to filter candidate slots.
  scheduling_hours_pt:
    start: null                     # e.g. "09:00"
    end: null                       # e.g. "17:30"

  # Hard-no windows — recurring blocks the scheduler must never propose.
  # Free-text; written in the user's tz. The scheduler parses these
  # loosely ("Fri 15:00-17:00" = every Friday afternoon).
  scheduling_hard_nos: []           # e.g. ["Fri 15:00-17:00"]

location:
  # Where you currently live, formatted "City, ST". Cited on "where are
  # you based" questions.
  base_city: null                   # e.g. "San Francisco, CA"

  # Cities you'd consider relocating to. The reply-drafter cites this
  # list when the recruiter mentions a city outside base_city.
  willing_to_relocate_to: []        # e.g. ["New York, NY", "Seattle, WA"]

  # Cities you would categorically NOT relocate to. The reply-drafter
  # will decline any role gated on one of these and flag the tracker's
  # next_action to "withdraw".
  hard_no_cities: []

  # Accepted values: "remote", "hybrid", "onsite". Used on "are you
  # open to X-mode" questions.
  remote_preference: null

work_history_disclosure:
  # Short, recruiter-safe explanation for leaving your last role. If the
  # question is asked and this is null, draft inserts [USER TO ANSWER].
  reason_for_leaving_last: null     # e.g. "ended a focused independent stretch; ready for a team again"

  # True if you can produce references on request. The reply-drafter
  # cites this verbatim — it never offers contact info for references.
  # Sharing references themselves stays manual.
  reference_contacts_available: null  # true / false / null
