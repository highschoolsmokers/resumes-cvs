# replies/<YYYY-MM-DD>-<topic>.provenance.yaml — per spec §8.8.
#
# One entry per concrete claim in the reply body. Pure voice /
# connective tissue (openers, closers) does not need an entry.
#
# Allowed source keys (resolved by scripts/check_provenance.py):
#
#   personal-fact:<dotted.path>  -> config/personal-facts.yaml
#   bullet:<id>                  -> bullets.yaml -> bullets[*].id
#   summary:<id>                 -> bullets.yaml -> summaries[*].id
#   skill:<key>                  -> bullets.yaml -> skills
#   education:<id>               -> bullets.yaml -> education[*].id
#   company-fact:<anchor>        -> company-facts.md -> "## <anchor>"
#   voice:<relative-path>        -> voice-corpus/<path>
#   template:<anchor>            -> listing.md -> "## <anchor>"
#
# `[USER TO ANSWER: ...]` sentences are placeholders, not claims — do
# NOT list them here under `claims`, and do NOT put them in
# `unsourced_claims`. The checker only validates `claims[].source`
# entries and the emptiness of `unsourced_claims`; placeholder sentences
# in the body text aren't inspected.
#
# unsourced_claims MUST be an empty list. Pre-commit hook
# (scripts/check_provenance.py --block) rejects the commit otherwise.

# `artifact:` is relative to THIS file's directory. This sidecar lives
# in replies/, so the value is just the markdown filename.
artifact: <YYYY-MM-DD>-<topic>.md
generated_at: "YYYY-MM-DDTHH:MM:SS-07:00"
generator: "reply-drafter agent"

thread:
  message_id: "<original-recruiter-message-id>"
  subject: "<original subject, without the Re: prefix>"
  recruiter_email: "<recruiter@company.com>"

claims:
  # Example: eligibility answer
  - claim: "<verbatim sentence from the draft>"
    source: "personal-fact:eligibility.us_work_auth"

  # Example: compensation answer
  - claim: "<verbatim sentence from the draft>"
    source: "personal-fact:compensation.target_base_usd"

  # Example: experience answer — must trace to bullets.yaml or the committed resume.
  - claim: "<verbatim sentence from the draft>"
    source: "bullet:<bullet-id>"

  # Example: voice-lifted rhythm (rare — only when phrasing is borrowed).
  - claim: "<verbatim sentence from the draft>"
    source: "voice:<relative/path.md>"

unsourced_claims: []
