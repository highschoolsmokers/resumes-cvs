# resume-plan.yaml — the instruction set the resume-tailor feeds into
# `python build_resume.py --plan <this file> --out resume.docx`.
#
# Every ID in this file MUST resolve in bullets.yaml. The pre-commit
# hook (scripts/check_provenance.py) will block an application commit
# whose resume.provenance.yaml references IDs not present in the
# closed universe.
#
# Allowed tailoring moves (spec §4.3):
#   - reorder roles (reverse-chronological only — don't hide recent roles)
#   - pick which bullets to show per role
#   - choose a role title from title_alternates keyed to target_role_family
#   - reorder skill_order
#   - pick a pre-written summary_id, or compose summary_text from existing
#     summaries sentences (still must be cited in provenance)
#   - set show_projects / show_publications / show_community

target_role_family: "<one of criteria.yaml role_families>"

# Preferred: reference a summary ID from bullets.yaml -> summaries[*].id.
summary_id: "<summary-id>"

# Only use summary_text if summary_id can't express the right framing.
# Every proper noun in summary_text must appear in the bullets that back it,
# and the provenance sidecar must still cite a `summary:` id.
summary_text: null

# Order of skill groups in the Skills section. Defaults are set in
# bullets.yaml -> skills_menu[].id.
skill_order:
  - "<skill-group-id-1>"
  - "<skill-group-id-2>"
  - "<skill-group-id-3>"
  - "<skill-group-id-4>"

# Per-role bullet IDs, in the order they should render. Keys are role IDs
# from bullets.yaml -> roles[].id. Reverse-chronological ordering of
# roles is enforced by build_resume.py.
bullets_by_role:
  "<role-id-1>":
    - "<bullet-id>"
    - "<bullet-id>"
  "<role-id-2>":
    - "<bullet-id>"

# Defaults: show everything. Set to false only if the resume is spilling
# to a second page.
show_projects: true
show_publications: true
show_community: true

# Free-form — not read by build_resume.py. The resume-tailor agent writes
# one entry per bullet chosen, linking the JD signal to the bullet ID.
# Useful when the user reviews the plan. The fit-report.md is the
# human-readable version of this.
picked_because:
  - "<bullet-id>: JD line that matched"
