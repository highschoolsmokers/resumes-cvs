# cover-letter.provenance.yaml — per spec §8.8.
#
# One entry per sentence in cover-letter.md that carries a factual claim.
# Sentences that are pure voice / connective tissue don't need an entry.
#
# Allowed source keys (resolve inside the closed universe, checked by
# scripts/check_provenance.py):
#
#   bullet:<id>              -> bullets.yaml -> bullets[*].id
#   summary:<id>             -> bullets.yaml -> summaries[*].id
#   company-fact:<anchor>    -> company-facts.md -> "## <anchor>"
#   voice:<relative-path>    -> voice-corpus/<path>
#   listing:<heading>        -> listing.md -> "## <heading>"
#
# unsourced_claims MUST be an empty list. If it isn't, the pre-commit
# hook (scripts/check_provenance.py --block) rejects the commit.

artifact: cover-letter.md
generated_at: "YYYY-MM-DDTHH:MM:SS-07:00"
generator: "cover-letter-writer agent + build_cover_letter.py"

claims:
  # Hook paragraph — cite company-facts.md anchors or listing.md headings.
  - claim: "<verbatim sentence from the hook paragraph that names a concrete company detail>"
    source: "company-fact:<anchor>"

  # Bridge paragraph — every experience claim traces to a bullet.
  - claim: "<verbatim sentence from the bridge paragraph>"
    source: "bullet:<bullet-id>"
  - claim: "<verbatim sentence from the bridge paragraph>"
    source: "bullet:<bullet-id>"

  # Close paragraph — usually a forward-looking statement, which may not
  # need a citation. If it references a specific company offering, cite
  # the company-facts.md anchor.
  - claim: "<verbatim sentence from the close paragraph>"
    source: "company-fact:<anchor>"

unsourced_claims: []
